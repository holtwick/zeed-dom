name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build tools (vite, vitest, tsdown) need Node 22.18+
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install
      - run: npm test
      - run: npm run build

      # The oldest Node version the package supports, see `engines`
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Load the build on Node 22
        run: |
          node -e "const d = require('./dist/index.node.cjs'); if (!d.parseHTML) process.exit(1)"
          node -e "const j = require('./jsx-runtime/index.cjs'); if (!j.jsx) process.exit(1)"
          node --input-type=module -e "const d = await import('./dist/index.node.js'); const j = await import('./jsx-runtime/index.js'); if (!d.parseHTML || !j.jsx) process.exit(1)"

  bun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - run: npm install
      # The whole suite with Bun as the runtime
      - run: npm run test:bun
      - run: npm run build
      - name: Load the build with Bun
        run: |
          bun -e "const d = require('./dist/index.node.cjs'); if (!d.parseHTML) process.exit(1)"
          bun -e "const d = await import('./dist/index.node.js'); const j = await import('./jsx-runtime/index.js'); if (!d.parseHTML || !j.jsx) process.exit(1)"

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install

      # The browser binaries are cached per Playwright version, there is no
      # lockfile so the version is read from what npm installed
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      # The system libraries are not part of the cache
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # The whole suite in Chromium, Firefox and WebKit
      - run: npm run test:browser
